services:
  - type: web
    name: microledger
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DATABASE_URL
        fromDatabase:
          name: microledger-db
          property: connectionString

databases:
  - name: microledger-db
    databaseName: microledger
    user: microledger_user
    plan: free
    region: oregon
