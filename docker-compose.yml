version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: microledger-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: microledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d microledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: microledger-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/microledger
      JWT_SECRET: microledger_super_secure_jwt_secret_production_key_2026
      JWT_EXPIRES_IN: 8h
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  postgres_data:
